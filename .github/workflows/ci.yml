name: CI Lubrae

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: shellcheck -x lubrae.sh tests/*.sh
  
  test-user:
    name: Tests (As normal user)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools for format
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools
      - name: Unit tests
        run: make test
  
  test-root:
    name: Tests (As root)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install tools for format
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools
      - name: Unit tests
        run: sudo make test